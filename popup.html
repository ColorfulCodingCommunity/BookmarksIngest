<!DOCTYPE html>
<html>

<head>
  <title>AI Bookmarks Digest</title>
  <style>
    body {
      font-family: sans-serif;
      width: 300px;
      padding: 10px;
    }

    textarea {
      width: 100%;
      height: 200px;
    }

    button {
      margin-top: 5px;

      /* Look nice */
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 5px;
      cursor: pointer;

      background-color: #f0f0f0;
    }

    button:hover {
      background-color: #e0e0e0;
    }

    .button-container {
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .folder-select {
      margin: 10px 0;
      max-height: 150px;
      overflow-y: auto;
    }

    .folder-select label {
      display: block;
      margin: 5px 0;
    }

    .folder-select input[type="checkbox"] {
      margin-right: 5px;
    }
  </style>
</head>

<body>
  <h3 id="title">AI Bookmarks Digest</h3>
  <div class="folder-select" id="folderSelect">
    <div id="folderList"></div>
  </div>
  <div class="button-container">
    <button id="generate">Generate Simple Digest</button>
    <br />
    <button id="fetchMeta">Fetch Meta Descriptions (batches of 5)</button>
    <button id="stop">Stop Fetching...</button>
    <br/>
    <button id="copy">Copy to Clipboard</button>
    <button id="clear">Clear</button>
    <br />
  </div>
  <!-- Label -->
  <label for="digest">Output Digest: </label>
  <textarea id="digest"></textarea>
  <script src="popup.js"></script>

  <p id="status"></p>
</body>

</html>
